<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-Centrale REP</title>
  <meta name="description" content="Simulateur pédagogique schématique d'une centrale REP 4 boucles (générique).">
  <link rel="stylesheet" href="style.css">
  <script src="mode.js"></script>
</head>
<body>
  <div id="chargement">
    <div class="carte-chargement">
      <strong>Mini-Centrale REP</strong>
      <p id="chargement-texte">Démarrage du simulateur…</p>
    </div>
  </div>

  <!-- ======================= barre du haut ======================= -->
  <header id="barre">
    <div class="bloc titre" title="">
      <strong>Mini-Centrale REP</strong>
      <span id="version" class="discret"></span>
    </div>
    <div class="bloc temps">
      <span id="temps" class="valeur gros">00:00:00</span>
      <div class="segment" id="accelerations">
        <button data-pause="1" title="Pause (espace)">⏸</button>
      </div>
      <span id="accel-reelle" class="discret petit" title="Accélération réellement tenue par le calcul"></span>
    </div>
    <div class="bloc"><span id="etat-standard" class="badge-etat"></span></div>
    <div class="bloc mesures-barre" id="mesures-barre"></div>
    <div class="bloc voyants" id="voyants"></div>
    <div class="bloc actions">
      <div class="menu">
        <button id="btn-menu" title="Scénarios, sauvegarde, aide">☰</button>
        <div id="menu-contenu" class="menu-contenu" hidden>
          <label class="discret">Scénario</label>
          <select id="choix-scenario"></select>
          <button id="btn-scenario">▶ Charger le scénario</button>
          <hr>
          <button id="btn-sauver">💾 Sauver l'état (JSON)</button>
          <button id="btn-charger">📂 Charger un état</button>
          <input type="file" id="fichier" accept=".json" hidden>
          <hr>
          <p class="discret petit">Molette : zoom · glisser : se déplacer · double-clic : zoom ×2<br>
            Clavier : + − 0 et flèches · espace : pause<br>Plus on zoome, plus il y a de détails.</p>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section id="zone-principale">
      <nav id="onglets">
        <button data-onglet="primaire" class="actif">Primaire</button>
        <button data-onglet="secondaire">Secondaire</button>
        <button data-onglet="asg">ASG</button>
        <button data-onglet="logique">Logique</button>
        <button data-onglet="courbes">Courbes</button>
        <button data-onglet="journal">Journal</button>
        <button id="btn-panneau" class="droite" title="Afficher / masquer le panneau des alarmes">🔔 <span id="nb-alarmes">0</span></button>
      </nav>
      <div id="onglet-primaire" class="onglet actif">
        <svg id="synoptique-primaire" class="synoptique" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div id="onglet-secondaire" class="onglet">
        <svg id="synoptique-secondaire" class="synoptique" viewBox="0 0 1500 880" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div id="onglet-asg" class="onglet">
        <svg id="synoptique-asg" class="synoptique" viewBox="0 0 1500 700" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div id="onglet-logique" class="onglet defile"><div id="logique"></div></div>
      <div id="onglet-courbes" class="onglet defile">
        <div id="courbes-outils">
          <input id="filtre-variables" placeholder="Filtrer les variables…">
          <select id="fenetre-courbes">
            <option value="300">5 min</option>
            <option value="1800" selected>30 min</option>
            <option value="7200">2 h</option>
          </select>
          <span class="discret">1 à 6 variables (clic pour cocher)</span>
        </div>
        <div id="courbes-corps">
          <div id="liste-variables"></div>
          <div id="graphes"></div>
        </div>
      </div>
      <div id="onglet-journal" class="onglet defile"><table id="journal"></table></div>
    </section>

    <aside id="panneau-droit">
      <section id="panneau-equipement" hidden>
        <h2><span id="eq-titre">Équipement</span><button id="btn-fermer-eq" class="discret-btn" title="Fermer">✕</button></h2>
        <div id="eq-resume"></div>
        <div id="eq-commandes"></div>
        <div id="eq-message"></div>
        <details id="eq-details"><summary class="discret">État détaillé</summary><div id="eq-etat"></div></details>
      </section>
      <section id="panneau-alarmes">
        <h2>Alarmes <button id="btn-acquitter-tout" title="Acquitter toutes les alarmes">Acquitter tout</button></h2>
        <ul id="alarmes"></ul>
      </section>
    </aside>
  </main>

  <script src="svg.js"></script>
  <script src="zoom.js"></script>
  <script src="coeur_geo.js"></script>
  <script src="synoptics/primaire.js"></script>
  <script src="synoptics/secondaire.js"></script>
  <script src="synoptics/asg.js"></script>
  <script src="transport.js"></script>
  <script src="curves.js"></script>
  <script src="app.js"></script>
</body>
</html>
