    type: Pump
    systeme: ABP
    q_nom_m3h: 1360                 # HYPOTHESE 60 % des purges nominales
    temps_demarrage_s: 5.0
    temps_ralentissement_s: 5.0
  clapet:
    type: CheckValve
    kv_max: 8000                    # HYPOTHESE (perte de charge faible)
  pompe_charge:
    type: Pump
    systeme: RCV
    q_nom_m3h: 34.0                 # spec
    puissance_kw: 600.0             # HYPOTHESE (charge électrique sur le tableau secouru)
    temps_demarrage_s: 5.0          # HYPOTHESE
    temps_ralentissement_s: 5.0
  vanne_rcv_isol:
    type: Valve
