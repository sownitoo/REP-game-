  RCV_ASP_VCT: {type: Valve, systeme: RCV, actionneur: MOV, alim: LHA, temps_course_s: 10.0}   # LCV-112B/C
  RCV_ASP_PTR: {type: Valve, systeme: RCV, actionneur: MOV, alim: LHB, temps_course_s: 10.0}   # LCV-112D/E
  RCV_BORI_URG: {type: Valve, systeme: REA, actionneur: MOV, alim: LHA, temps_course_s: 10.0}   # MO-8104
