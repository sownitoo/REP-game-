    q_nom_m3h: 86600                # HYPOTHESE 2 × 50 % (48 m³/s au total)
    temps_demarrage_s: 30.0         # HYPOTHESE
    temps_ralentissement_s: 60.0    # HYPOTHESE
  pompe_primaire:
    type: Pump
    systeme: RCP
    q_nom_m3h: 20100                # spec
    h_nom_m: 84                     # spec
    h0_m: 105                       # HYPOTHESE
    temps_demarrage_s: 20.0         # HYPOTHESE
    temps_ralentissement_s: 25.0    # spec : volant d'inertie, 22 à 30 s
    hauteur_rotor_bloque_m: 900     # HYPOTHESE antidévireur : débit inverse ≈ 15 % dans une boucle arrêtée
  pompe_huile:
    type: Pump
    systeme: RCP
    q_nom_m3h: 1.0                  # pompe de soulèvement d'huile (débit sans importance)
