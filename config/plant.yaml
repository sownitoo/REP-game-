# =============================================================================
# config/plant.yaml — SEULE source des valeurs numériques du simulateur.
#
# Centrale REP 4 boucles GÉNÉRIQUE, à but pédagogique. Ordres de grandeur issus
# des manuels publics USNRC (centrale de référence Trojan), PAS de valeurs EDF.
#
# Unités dans les clés : _bar (abs), _c (°C), _m3h, _kg_s, _m3, _mw, _s, _pct.
# « # HYPOTHESE » = valeur absente de la spec, choisie plausible.
# « {b} » dans un repère = composant dupliqué pour chaque boucle (1 à 4).
# =============================================================================

meta:
  version: V3
  nom: "Mini-Centrale REP 4 boucles (générique)"

simulation:
  dt_s: 0.1
  accelerations: [1, 10, 60, 600]
  historique_duree_s: 7200          # HYPOTHESE fenêtre des courbes (2 h simulées)
  historique_pas_s: 1.0             # HYPOTHESE échantillonnage des courbes
  diffusion_periode_s: 0.25         # HYPOTHESE période d'envoi de l'état à l'interface (temps réel)
  tick_reel_s: 0.1                  # pas d'horloge réelle du serveur
  budget_calcul_pct: 80             # part max du tick réel consacrée au calcul
  journal_max: 2000                 # HYPOTHESE nb d'événements gardés en mémoire
  p_atm_bar: 1.013

numerique:
  table_p_min_bar: 0.0062            # > point triple (0,00612 bar), borne IF97
  table_p_max_bar: 215.0
  table_nb_points: 2000
  table_t_pas_c: 0.25
  table_p_liquide_bar: 155.0        # pression de référence de l'eau du primaire (liquide comprimé)
  flash: {tolerance_lnp: 1.0e-10, pas_derivee_lnp: 1.0e-6, iterations_max: 40}
  reseau:
    tolerance_kg_s: 1.0e-5
    iterations_max: 100
    recherche_lineaire_max: 30       # divisions par 2 du pas de Newton au maximum
    pas_max_bar: 30.0
    zone_lineaire_bar: 1.0e-4       # régularisation de la loi en racine près de ΔP = 0
    fuite_vanne_fermee_kg_s_bar: 1.0e-7
    fuite_clapet_kg_s_bar: 1.0e-3
    regularisation_jacobien: 1.0e-12
  collecteur: {tolerance_kg_s: 1.0e-4, iterations_max: 80}
  alarmes_hysteresis_pct: 1.0       # HYPOTHESE
  alarmes_temporisation_s: 2.0      # HYPOTHESE confirmation d'apparition / disparition (anti-papillotement)
  iterations_initialisation: 20     # allers-retours régulations ↔ hydraulique à l'initialisation
  duree_stabilisation_s: 3600.0     # durée de stabilisation de l'état initial RP 100 %

# --- Point de fonctionnement nominal 100 % (initialisation et recalage) -------
point_nominal:
  p_coeur_mw: 3411                  # spec (Trojan)
  tmoy_c: 307.0                     # spec §4.1
  p_primaire_bar: 155.0             # spec §4.1
  niveau_pzr_pct: 60.0              # spec : ≈ 60 % d'eau à pleine puissance
  p_gv_bar: 63.0                    # spec §4.1
  niveau_gv_pct: 50.0               # HYPOTHESE
  qm_vapeur_kg_s: 1885              # (3 411 + 18 MW pompes) / (2 781 − 963) kJ/kg (CoolProp)
  t_alim_c: 224.0                   # spec : 221–227 °C
  p_collecteur_bar: 60.0            # HYPOTHESE (perte de charge lignes 3 bar)

# --- Cœur « boîte noire » (§4.16) ---------------------------------------------
coeur:
  p_nom_mw: 3411
  beta_pcm: 650                     # spec
  lambda_s: 0.08                    # spec (1 groupe de neutrons retardés)
  rho_max_fraction_beta: 0.9        # borne numérique : pas de surcriticité prompte (approximation du saut prompt)
  source_neutrons: 1.0e-9           # HYPOTHESE source intrinsèque (n ≈ S / abs(ρ) en sous-critique)
  alpha_mod_pcm_c: -20.0            # spec (au point nominal)
  t_alpha_mod_nul_c: 20.0           # HYPOTHESE α_mod ∝ (T − 20 °C) : coefficient modérateur faible à froid
  alpha_doppler_pcm_c: -2.5         # spec
  alpha_bore_pcm_ppm: -10.0         # spec
  bore_ppm: 1000.0                  # HYPOTHESE concentration au point nominal (ρ = 0)
  t_mod_ref_c: 307.0                # température modérateur de référence (ρ = 0 au nominal)
  combustible:
    t_nom_c: 620.0                  # HYPOTHESE T moyenne du combustible à 100 %
    capacite_mj_c: 45.0             # HYPOTHESE (constante de temps ≈ 4 s)
  residuelle:                       # groupes ajustés sur Way-Wigner (t_fonct ≈ 1 an), écart < 3 % de 1 s à 1 jour
    fractions: [0.03091, 0.01964, 0.01268, 0.007368, 0.005708, 0.001858, 0.004137]
    constantes_s: [1.0, 10.0, 100.0, 1000.0, 1.0e+4, 1.0e+5, 1.0e+6]
  grappes:
    pas_max: 228                    # spec (C-11 à 223 pas)
    regulation_pcm: -2000.0         # HYPOTHESE groupe R (régulation de température, auto / manuel)
    compensation_pcm: -1500.0       # HYPOTHESE groupe G (compensation de puissance, manuel ; extrait à 100 %)
    arret_pcm: -1500.0              # HYPOTHESE groupes S d'arrêt : R + G + S = −5 000 pcm (spec)
    position_nom_pas: 180.0         # HYPOTHESE position à 100 %
    temps_chute_s: 2.0              # spec
    vitesse_manu_pas_min: 48.0      # HYPOTHESE
    vitesse_arret_pas_min: 64.0     # HYPOTHESE extraction des groupes d'arrêt
    regulation_tmoy:                # HYPOTHESE (programme de vitesse en fonction de l'écart Tmoy − Tref)
      tref_programme_c: [[0, 292.0], [100, 307.0]]   # spec : 292 → 307 °C
      bande_morte_c: 0.8
      ecart_plein_c: 2.8
      vitesse_min_pas_min: 8.0
      vitesse_max_pas_min: 72.0
      desequilibre_gain_c_par_pct: 0.6      # HYPOTHESE (calé sur l'échelon −10 %) voie « déséquilibre de puissance » (anticipation)
      desequilibre_constante_s: 60.0        # HYPOTHESE filtre passe-haut de cette voie

# --- Circuit primaire (RCP) ---------------------------------------------------
primaire:
  volumes_m3: {descente: 45.0, coeur: 25.0, plenum: 45.0, branche_chaude: 4.0, gv: 30.0, branche_froide: 8.0}   # HYPOTHESE (≈ 283 m³ hors PZR)
  capacites_metal_mj_c: {descente: 120.0, coeur: 20.0, plenum: 80.0, branche_chaude: 10.0, gv: 60.0, branche_froide: 20.0}   # HYPOTHESE
  hauteur_thermique_m: 10.0         # spec (Δz GV / cœur, circulation naturelle)
  boucle_expansion: 2               # spec : ligne d'expansion sur la branche chaude B2
  boucles_aspersion: [2, 3]         # spec
  boucle_charge: 1                  # spec
  boucle_decharge: 3                # spec
  gv_ua_mw_c: 37.6                  # recalé (ε-NTU, cp moyen) pour P GV = 63 bar au nominal
  gv_exposant_debit: 0.8            # spec (option UA ∝ débit^0,8)
  gv_fraction_ua_min: 0.3           # HYPOTHESE (convection naturelle à faible débit)
  chaleur_pompe_mw: 4.5             # spec (puissance moteur à chaud, dissipée dans l'eau)
  debit_nom_boucle_kg_s: 4133       # calé : débit au point nominal (≈ 19 900 m³/h à 289 °C)
  p_min_demarrage_pompe_bar: 29.0   # spec : ΔP joint n°1 ≥ 19 bar
  soulevement_huile_s: 120.0        # HYPOTHESE durée mini de la pompe de soulèvement d'huile avant démarrage

# --- Pressuriseur (PZR) --------------------------------------------------------
pressuriseur:
  volume_m3: 51.0                   # spec
  programme_niveau_pct: [[292.0, 25.0], [307.0, 60.0]]   # spec (indicatif) : Tmoy → niveau
  niveau_bas_pct: 17.0              # spec : isolement décharge + chaufferettes coupées
  pertes_thermiques_kw: 60.0        # HYPOTHESE
  chaufferettes: {proportionnelles_kw: 414.0, tor_kw: 1380.0}   # spec
  gamme_pression_bar: 200.0         # HYPOTHESE gamme des capteurs de pression
  aspersion: {debit_vanne_m3h: 95.0, debit_permanent_m3h: 0.23}   # spec
  porv: {capacite_kg_s: 26.5, p_ref_bar: 162.0}                     # spec
  soupapes: {tarages_bar: [172.0, 172.0, 172.0], capacite_kg_s: 53.0, fermeture_pct: 3.0}   # spec ; blowdown HYPOTHESE
  voies_pression: 4
  voies_niveau: 3
  retard_mesure_s: 0.5              # HYPOTHESE

# --- Charge / décharge simplifiées (V1 ; RCV complet en V2) ---------------------
rcv:
  t_vct_c: 46.0                     # HYPOTHESE température de l'eau dans la VCT
  vct_volume_m3: 10.0               # HYPOTHESE volume utile (0 → 100 % de niveau)
  vct_niveau_initial_pct: 50.0      # HYPOTHESE
  vct_seuils_pct: {tres_bas: 5.0, bas: 20.0, haut: 70.0}   # HYPOTHESE : bascule PTR, appoint auto, déviation
  pompe_charge: {q_nom_m3h: 34.0, dp_nom_bar: 172.0, dp0_bar: 185.0}   # spec (hauteur à débit nul ~185 bar)
  charge_max_m3h: 34.0              # FCV-121 grande ouverture
  dp_ligne_charge_bar: 5.0          # HYPOTHESE (ligne de charge + aspiration)
  joints: {injection_m3h: 7.3, entree_primaire_m3h: 4.5}   # spec : 7,3 m³/h vers les joints, 4,5 entrent au primaire
  orifices_m3h: [17.0, 17.0, 10.0]  # spec (à 155 bar)
  p_orifices_ref_bar: 155.0         # spec
  p_aval_orifices_bar: 24.5         # spec (PCV-131)
  rra_vers_rcv_m3h: 30.0            # HYPOTHESE HCV-128 (purification pendant le RRA)
  efficacite_regenerateur: 0.88     # spec : charge 54 → 260 °C avec une décharge à 288 °C
  t_sortie_echangeur_c: 49.0        # spec (échangeur de décharge refroidi par le RRI)
  t_sortie_sans_rri_c: 143.0        # spec (sortie du régénérateur)
  ptr: {volume_m3: 1600.0, bore_ppm: 2500.0, t_c: 20.0}   # HYPOTHESE bâche PTR

# --- Appoint eau et bore (REA) ---------------------------------------------------
rea:
  bore_acide_ppm: 7000.0            # spec
  volume_acide_m3: 184.0            # spec (2 × 92 m³)
  volume_eau_m3: 770.0              # spec
  debit_auto_m3h: 18.0              # spec
  debit_borication_m3h: 10.0        # HYPOTHESE (pompe de transfert d'acide borique)
  debit_dilution_m3h: 20.0          # HYPOTHESE
  debit_urgence_m3h: 10.0           # HYPOTHESE (borication d'urgence MO-8104)

# --- Refroidissement à l'arrêt (RRA) ---------------------------------------------
rra:
  trains: [1, 2]                    # spec : 2 pompes + 2 échangeurs
  p_ouverture_max_bar: 30.0         # spec : verrou d'ouverture de l'aspiration
  p_fermeture_auto_bar: 41.0        # spec
  ua_echangeur_mw_c: 1.2            # HYPOTHESE (177 → 60 °C en ~16 h sur 2 voies)
  debit_rri_m3h: 1000.0             # HYPOTHESE côté RRI, par échangeur
  chaleur_pompe_mw: 0.3             # HYPOTHESE

# --- Réfrigération intermédiaire (RRI) et eau brute secourue (SEC) -----------------
rri:
  capacite_mj_c: 1250.0             # HYPOTHESE (~300 m³ d'eau)
  t_initiale_c: 25.0                # HYPOTHESE
  ua_echangeur_mw_c: 2.0            # HYPOTHESE échangeur RRI/SEC, un par voie
  debit_pompe_m3h: 2500.0           # HYPOTHESE
  chaleur_fixe_mw: 6.0              # HYPOTHESE autres utilisateurs (moteurs, ventilation…)
  chaleur_par_pompe_primaire_mw: 0.5   # HYPOTHESE (barrière thermique + paliers)
  delai_pompes_primaires_s: 300.0   # HYPOTHESE : sans RRI, défaut des pompes primaires (spec : arrêt en ~2 min)
sec:
  debit_pompe_m3h: 3000.0           # HYPOTHESE

# --- Électricité (§4.12) : réseau, 6,6 kV normaux (LG), secourus (LH), diesels, 125 V cc (LB) -------
electricite:
  tableaux_normaux: [LGA, LGB]
  tableaux_secourus: [LHA, LHB]         # LHA ← LGA / diesel A ; LHB ← LGB / diesel B
  batteries: [LBA, LBB]                 # 125 V cc chargés depuis LHA / LHB
  sous_tension_pct: 62.0                # spec : démarrage diesel si < 62 % pendant 1 s
  sous_tension_delai_s: 1.0             # spec
  diesel:
    puissance_kw: 4400.0                # spec
    temps_demarrage_s: 10.0             # spec : démarrage + prise de charge ≤ 10 s
    surcharge_pct: 110.0                # HYPOTHESE
    surcharge_delai_s: 20.0             # HYPOTHESE déclenchement sur surcharge
  sequenceur_arret:                     # spec (s après le couplage du diesel) ; HYPOTHESE pour ASG et air
    - {t_s: 2.0, pompes: {LHA: RCV_PC1, LHB: RCV_PC2}}
    - {t_s: 6.5, pompes: {LHA: RRI_P1, LHB: RRI_P2}}
    - {t_s: 11.0, pompes: {LHA: SEC_P1, LHB: SEC_P2}}
    - {t_s: 15.5, pompes: {LHA: ASG_MP1, LHB: ASG_MP2}}
    - {t_s: 20.0, pompes: {LHA: SAR_C1, LHB: SAR_C2}}
  sequenceur_accident:                  # spec (avec IS) ; l'injection de sécurité elle-même arrive en V4
    - {t_s: 2.0, pompes: {LHA: RCV_PC1, LHB: RCV_PC2}}
    - {t_s: 15.5, pompes: {LHA: ASG_MP1, LHB: ASG_MP2}}
    - {t_s: 20.0, pompes: {LHA: RRI_P1, LHB: RRI_P2}}
    - {t_s: 24.5, pompes: {LHA: SEC_P1, LHB: SEC_P2}}
    - {t_s: 29.0, pompes: {LHA: SAR_C1, LHB: SAR_C2}}
  charges_fixes_kw: 400.0               # HYPOTHESE 380 V secouru, chargeurs, ventilation, par tableau
  batterie_autonomie_s: {LBA: 7200.0, LBB: 1800.0}   # spec : voie A 2 h, voie B 30 min
  batterie_recharge_s: 28800.0          # HYPOTHESE recharge complète en 8 h
  # contrôle-commande sur batterie : sans 125 V, ces équipements sont perdus
  commande_cc: {LBA: [ASG_TP], LBB: []}  # HYPOTHESE régulation de la turbopompe ASG sur la voie A

# --- Air comprimé (§4.13) -------------------------------------------------------------
air_comprime:
  p_nom_bar: 7.0                        # HYPOTHESE
  p_min_bar: 5.0                        # HYPOTHESE : en dessous, les vannes pneumatiques perdent leur air
  chute_bar_min: 0.5                    # HYPOTHESE baisse de pression sans compresseur (consommation normale)
  capacite_compresseur: 1.5             # HYPOTHESE débit d'un compresseur / consommation normale
  fuite_rupture: 4.0                    # HYPOTHESE rupture du collecteur : 4 × la consommation normale

# --- Joints des pompes primaires (§4.1) ----------------------------------------------------
joints_pp:
  delai_degradation_s: 780.0            # HYPOTHESE (≈ 13 min sans injection ni barrière thermique)
  fuite_initiale_m3h: 4.8               # HYPOTHESE (≈ 21 gpm par pompe, à 155 bar)
  delai_rupture_s: 3600.0               # HYPOTHESE : une heure plus tard, joints détruits
  fuite_max_m3h: 68.0                   # spec (par pompe, en black-out)
  p_ref_bar: 155.0

# --- Accumulateurs (RIS, partie passive) ---------------------------------------------
accumulateurs:
  volume_m3: 38.0                   # HYPOTHESE (par accumulateur, un par boucle)
  volume_eau_m3: 29.0               # HYPOTHESE
  p_azote_bar: 42.0                 # spec
  bore_ppm: 2500.0                  # HYPOTHESE
  t_c: 40.0                         # HYPOTHESE
  k_m3h_par_racine_bar: 270.0       # HYPOTHESE (~600 m³/h sous 5 bar d'écart)

# --- Alimentation de secours des GV (ASG) ---------------------------------------
asg:
  prises_vapeur_tps: [1, 2]         # HYPOTHESE GV alimentant la turbopompe
  p_vapeur_min_bar: 7.0             # HYPOTHESE pression mini pour entraîner la turbopompe
  vapeur_tps_kg_s: 8.0              # HYPOTHESE consommation à pleine vitesse

# --- Générateurs de vapeur (côté secondaire) --------------------------------
generateurs_vapeur:
  boucles: [1, 2, 3, 4]
  masse_assechement_t: 8.0          # HYPOTHESE : en dessous, UA réduit (tubes découverts)
  v_secondaire_m3: 165              # HYPOTHESE
  debit_vapeur_nom_kg_s: 471        # 1 885 / 4
  niveau_ge:
    v_bas_m3: 46.7                  # HYPOTHESE → ~42 t d'eau à 100 % et 50 % GE
    v_plage_m3: 40.0                # HYPOTHESE (≈ 11 m² × 3,6 m)
    k_bulles: 0.6                   # HYPOTHESE calé : tassement ≈ −25 %GE sur déclenchement turbine
    tau_sejour_s: 1.5               # HYPOTHESE temps de séjour des bulles sous le niveau
    tau_bulles_s: 1.0               # HYPOTHESE constante de temps du taux de vide
    filtre_dpdt_s: 0.5              # HYPOTHESE filtrage de dP/dt (vaporisation éclair)
    voies: 3
    retard_mesure_s: 0.5            # HYPOTHESE
  programme_niveau_pct: [[0, 50.0], [100, 50.0]]   # HYPOTHESE (consigne constante)
  seuils:
    tres_bas_pct: 11.5              # AU, 2/3 sur 1 GV
    tres_haut_pct: 69.0             # P-14, 2/3 sur 1 GV
    vote: "2/3"

# --- Vapeur principale (VVP) -------------------------------------------------
vapeur:
  ligne:
    qm_nom_kg_s: 471
    dp_nom_bar: 3.0                 # HYPOTHESE perte de charge GV → collecteur à 100 %
    p_nom_bar: 63.0
    limiteur_kg_s: 1220             # venturi (spec)
    fraction_bypass_viv: 0.02       # HYPOTHESE capacité du by-pass de VIV
  soupapes:
    tarages_bar: [82.0, 83.0, 84.0, 85.0, 86.0]
    capacite_kg_s: 103              # 109 % × 1 885 kg/s / 20 soupapes
    fermeture_pct: 4.0              # HYPOTHESE (blowdown)
  vda:
    capacite_kg_s: 47               # 10 % du débit nominal d'un GV
    p_ref_bar: 79.0

# --- Turbine + alternateur (GRE) --------------------------------------------
turbine:
  debit_nom_kg_s: 1885
  p_admission_nom_bar: 60.0
  ouverture_nom: 0.85               # HYPOTHESE ouverture des vannes de réglage à 100 %
  eta_isentropique: 0.835           # HYPOTHESE calée : ≈ 1 135 MWe pour 1 885 kg/s
  fraction_soutirage: 0.333         # spec : reprise des purges ≈ 1/3 du débit
  part_travail_soutirage: 0.5       # HYPOTHESE : un soutirage fait en moyenne la moitié de la détente
  rendement_alternateur: 0.985      # HYPOTHESE
  p_elec_nom_mw: 1135               # HYPOTHESE (résultat du calage)
  consigne_max_pct: 105.0           # HYPOTHESE
  vitesse_nom_tr_min: 1500          # 4 pôles, 50 Hz
  constante_inertie_s: 4.0          # HYPOTHESE H (énergie cinétique / puissance apparente)
  puissance_apparente_mva: 1280
  pertes_ventilation_pct: 0.5       # HYPOTHESE à vitesse nominale
  vannes_arret: 4
  temps_fermeture_arret_s: 0.3      # HYPOTHESE
  temps_ouverture_arret_s: 10.0     # HYPOTHESE
  temps_course_reglage_s: 2.0       # HYPOTHESE
  regulation_charge: {rampe_pct_min: 5.0, echelon_max_pct: 10.0, kp: 0.5, ti_s: 5.0, runback_pct_min: 20.0}   # rampe/échelon : spec ; PI, runback HYPOTHESE
  regulation_vitesse: {rampe_pct_min: 20.0, kp: 5.0, ti_s: 10.0}                      # HYPOTHESE
  couplage: {ecart_vitesse_max_pct: 0.5}                                                # HYPOTHESE

# --- Contournement condenseur (GCT-c) ---------------------------------------
gct_c:
  groupes: 4                        # 12 vannes en 4 groupes (spec), 1 vanne équivalente par groupe
  capacite_groupe_kg_s: 188         # HYPOTHESE 10 % du débit nominal par groupe (40 % au total)
  p_ref_bar: 76.0
  temps_course_s: 3.0               # HYPOTHESE
  regulation: {consigne_bar: 76.0, bande_bar: 3.0}   # mode pression ; HYPOTHESE
  mode_initial: tmoy                # tmoy (C-7 / C-8) | pression
  tmoy:                             # HYPOTHESE (ordres de grandeur Westinghouse)
    t_vide_c: 292.0                 # Tmoy à puissance nulle
    bande_morte_c: 1.7              # régulateur « perte de charge »
    bande_perte_charge_c: 12.0
    bande_declenchement_c: 16.7     # régulateur « déclenchement turbine »
  c7: {echelon_pct: 10.0, constante_s: 120.0}   # spec : > 10 % en échelon ou > 5 %/min (10 % sur 2 min)
  p12: {tmoy_c: 289.0, groupes_autorises: 1}    # spec : seul le groupe « refroidissement » reste disponible

# --- Condenseur, circulation (CRF), puits, bâche de stockage (CST) -----------
condenseur:
  t_mer_c: 12.0                     # HYPOTHESE Manche, moyenne annuelle
  cp_eau_mer_kj_kgk: 4.0
  rho_eau_mer_kg_m3: 1025
  ua_mw_c: 65.2                     # recalé : 2 267 MW, T mer 12 °C, ΔT mer ~11 °C
  capacite_thermique_mj_c: 1000     # HYPOTHESE (métal + eau du puits)
  p_incondensables_bar: 0.005       # HYPOTHESE (éjecteurs en service)
  t_max_c: 105.0                    # HYPOTHESE borne numérique (disques de rupture)
puits:
  volume_m3: 300                    # HYPOTHESE (~2 min de débit CEX)
  hauteur_m: 2.0                    # HYPOTHESE
  hauteur_aspiration_m: 8.0         # HYPOTHESE charge statique au-dessus des CEX
  niveau_initial_pct: 50.0
cst:
  volume_m3: 1700
  volume_initial_m3: 1400           # HYPOTHESE
  volume_mini_m3: 905               # spec
  hauteur_m: 15.0                   # HYPOTHESE
  t_c: 30.0                         # HYPOTHESE eau déminéralisée stockée à l'extérieur

# --- Poste d'eau --------------------------------------------------------------
poste_eau:
  rechauffeurs:
    abp_sortie_c: [[0, 50.0], [20, 120.0], [50, 160.0], [100, 182.0]]    # spec 49 → 182 °C ; loi en charge HYPOTHESE
    ahp_sortie_c: [[0, 50.0], [20, 150.0], [50, 195.0], [100, 224.0]]    # spec 182 → 227 °C ; loi en charge HYPOTHESE
    tau_s: 120.0                    # HYPOTHESE inertie thermique des réchauffeurs
  reprise:
    pompes: [REP1, REP2]
    capacite_pompe_pct: 60.0        # HYPOTHESE (1 pompe ≈ 90 % de puissance, spec)
    p_plein_debit_bar: 32.0         # HYPOTHESE : débit max tant que P refoulement < cette valeur
    p_arret_bar: 45.0               # HYPOTHESE : pression à débit nul (pompe en butée)

# --- Gabarits : modèles partagés par plusieurs composants --------------------
gabarits:
  pompe_cex:
    type: Pump
    systeme: CEX
    q_nom_m3h: 2500
    h_nom_m: 340
    h0_m: 400                       # HYPOTHESE
    temps_demarrage_s: 5.0          # HYPOTHESE
    temps_ralentissement_s: 10.0    # HYPOTHESE
  pompe_app:
    type: Pump
    systeme: APP
    entrainement: turbine_vapeur
    q_nom_m3h: 4500
    h_nom_m: 520                    # HYPOTHESE
    h0_m: 650                       # HYPOTHESE
    vitesse_variable: true
    vitesse_min: 0.3                # HYPOTHESE
    vitesse_max: 1.1                # HYPOTHESE
    temps_demarrage_s: 20.0         # HYPOTHESE
    temps_ralentissement_s: 15.0    # HYPOTHESE
  pompe_crf:
    type: Pump
