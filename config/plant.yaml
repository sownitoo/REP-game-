  ASG_TP_VAP: {type: Valve, systeme: ASG, actionneur: AOV, air: SAR, temps_course_s: 3.0,   # spec : s'ouvre si perte d'énergie
               position_repli: ouverte, reserve_air_min: 0.0}
  ASG_MP1_CLAPET: {gabarit: clapet, systeme: ASG, kv_max: 500}
  ASG_MP2_CLAPET: {gabarit: clapet, systeme: ASG, kv_max: 500}
  ASG_TP_CLAPET: {gabarit: clapet, systeme: ASG, kv_max: 1000}
  ASG{b}: {gabarit: vanne_asg}
  ASG{b}_CLAPET: {gabarit: clapet, systeme: ASG, kv_max: 500}

# --- Réseaux liquides (liaisons) ---------------------------------------------
# frontieres : pression imposée par un volume ; noeuds : jonctions sans stockage.
# elements : en série ; une sous-liste [X, Y] = vannes en parallèle.
reseaux:
  eau_alimentaire:
    frontieres: [PUITS, CONDENSEUR, CST, GV1, GV2, GV3, GV4]
    noeuds: [N_CEX, N_ABP, N_APP, N_ARE]
    injections: [N_ABP]               # pompes de reprise des purges
    branches:
      - {id: L_CEX1, de: PUITS, vers: N_CEX, elements: [CEX1, CEX1_CLAPET]}
      - {id: L_CEX2, de: PUITS, vers: N_CEX, elements: [CEX2, CEX2_CLAPET]}
      - {id: L_RECIRC, de: N_CEX, vers: CONDENSEUR, elements: [CEX_RECIRC]}
      - {id: L_REJET, de: N_CEX, vers: CST, elements: [PUITS_REJET]}
      - {id: L_APPOINT, de: CST, vers: CONDENSEUR, elements: [PUITS_APPOINT]}
      - {id: L_ABP, de: N_CEX, vers: N_ABP, elements: [ABP]}
      - {id: L_APP1, de: N_ABP, vers: N_APP, elements: [APP1, APP1_CLAPET]}
      - {id: L_APP2, de: N_ABP, vers: N_APP, elements: [APP2, APP2_CLAPET]}
      - {id: L_APD, de: N_ABP, vers: N_APP, elements: [APD, APD_CLAPET]}
      - {id: L_AHP, de: N_APP, vers: N_ARE, elements: [AHP]}
      - {id: "L_ARE{b}", de: N_ARE, vers: "GV{b}", elements: ["ARE{b}_ISOL", ["ARE{b}_GD", "ARE{b}_PD"], "ARE{b}_CLAPET"]}

  primaire:                           # boucles : plénum → BC → GV → pompe → BF → descente ; retour par la cuve
    frontieres: [PLENUM]
    noeuds: [DESCENTE]
    injections: []
    branches:
      - {id: "L_BOUCLE{b}", de: PLENUM, vers: DESCENTE, elements: ["PP{b}", "R_BOUCLE{b}"]}
      - {id: L_CUVE, de: DESCENTE, vers: PLENUM, elements: [R_CUVE]}
      # RRA : aspiration branche chaude B4 (ramenée au plénum) → pompe → échangeur / by-pass → branches froides
      - {id: L_RRA1, de: PLENUM, vers: DESCENTE, elements: [RRA_ASP1A, RRA_ASP1B, RRA_P1, RRA_CLAPET1, [RRA_HX1, RRA_BP1]]}
      - {id: L_RRA2, de: PLENUM, vers: DESCENTE, elements: [RRA_ASP2A, RRA_ASP2B, RRA_P2, RRA_CLAPET2, [RRA_HX2, RRA_BP2]]}
  asg:
    frontieres: [CST, GV1, GV2, GV3, GV4]
    noeuds: [N_ASG]
    injections: []
    branches:
      - {id: L_ASG_MP1, de: CST, vers: N_ASG, elements: [ASG_MP1, ASG_MP1_CLAPET]}
      - {id: L_ASG_MP2, de: CST, vers: N_ASG, elements: [ASG_MP2, ASG_MP2_CLAPET]}
      - {id: L_ASG_TP, de: CST, vers: N_ASG, elements: [ASG_TP, ASG_TP_CLAPET]}
      - {id: "L_ASG{b}", de: N_ASG, vers: "GV{b}", elements: ["ASG{b}", "ASG{b}_CLAPET"]}

# --- Régulations ---------------------------------------------------------------
regulations:
  niveau_gv:                        # 3 éléments : niveau + débit vapeur + débit eau ; réglages HYPOTHESE
    kp_debit_pct_par_pct: 2.0
    ti_s: 300.0                     # calé : dépassement après déclenchement turbine ≈ 58 % (P-14 à 69 %)
    integrale_max_pct: 50.0
    trim_kp: 0.5
    trim_ti_s: 5.0
    dp_min_bar: 0.5
    debit_max_pct: 150.0
  dp_app:                           # vitesse APP régulée sur ΔP (refoulement ARE − collecteur vapeur) ; HYPOTHESE
    consigne_bar: [[0, 4.0], [100, 9.0]]
    kp_par_bar: 0.02
    ti_s: 10.0
  vda: {consigne_bar: 79.0, bande_bar: 2.0}         # tarage spec ; bande HYPOTHESE
  puits: {consigne_pct: 50.0, kp_par_pct: 0.1, ti_s: 600.0}   # HYPOTHESE
  cex_recirculation: {ouvre_m3h: 795, ferme_m3h: 1590}       # spec
  pression_pzr:                     # spec : TOR à consigne − 1,7 bar, aspersion au-dessus de consigne + 1,7 bar, PORV 162 bar
    consigne_bar: 155.0
    ti_s: 600.0                     # HYPOTHESE (régulateur maître PI, sortie en bar équivalents)
    proportionnelles_pleines_bar: -1.0   # HYPOTHESE
    proportionnelles_nulles_bar: 1.0     # HYPOTHESE
    tor_marche_bar: -1.7
    tor_arret_bar: -1.0             # HYPOTHESE (hystérésis)
    aspersion_debut_bar: 1.7
    aspersion_pleine_bar: 5.2       # HYPOTHESE
    porv_ouverture_bar: 162.0
    porv_fermeture_bar: 160.5       # HYPOTHESE (hystérésis)
  niveau_pzr: {kp_kg_s_par_pct: 0.4, ti_s: 300.0}   # HYPOTHESE (débit de charge)
  rra: {vitesse_refroidissement_c_h: 30.0, kp_par_c_h: 0.01, ti_s: 600.0}   # HYPOTHESE : vannes d'échangeur en auto
  niveau_asg: {consigne_pct: 40.0, kp_par_pct: 0.05, ti_s: 300.0}   # HYPOTHESE : sous la consigne ARE pour ne pas la contrer

# --- Logique de protection et automatismes ----------------------------------------
logique:
  p7: {puissance_max_pct: 10.0, charge_turbine_max_pct: 10.0}   # P-7 = non P-10 ET P-13
  p11_p_pzr_bar: 138.0              # spec : P-11, autorise le blocage de l'IS basse pression
  injection_securite: {p_pzr_basse_bar: 122.0, p_vapeur_basse_bar: 41.0, rearmement_s: 60.0}   # ordres de grandeur NRC
  etats:
    t_rra_max_c: 177.0              # spec
    p_rra_max_bar: 30.0             # spec
    t_arret_froid_c: 93.0           # spec
    vitesse_refroidissement_max_c_h: 56.0   # NRC (100 °F/h)
    t_froid_c: 60.0                 # température de calcul du bore d'arrêt à froid
    marge_arret_pcm: 1000.0         # HYPOTHESE marge d'antiréactivité visée
    grappe_coincee_pcm: 800.0       # HYPOTHESE grappe la plus efficace supposée coincée
  p8_puissance_pct: 39.0            # spec
  p9_puissance_pct: 50.0            # spec
  p10_puissance_pct: 10.0           # spec (2/4)
  p12_tmoy_c: 289.0                 # spec
  c2_puissance_pct: 103.0           # spec : interdit le retrait des grappes
  c5_charge_pct: 15.0               # spec : interdit le retrait automatique
  c11_pas: 223.0                    # spec : stoppe le retrait automatique
  au:
    flux_haut_pct: 109.0            # spec, 2/4, jamais bloqué
    flux_bas_pct: 25.0              # spec, 2/4, bloquable au-dessus de P-10
    variation_flux_pct: 5.0         # spec, 2/4
    variation_flux_constante_s: 2.0 # spec
    p_pzr_basse_bar: 129.6          # spec, 2/4, au-dessus de P-7
    p_pzr_haute_bar: 165.5          # spec, 2/4
    niveau_pzr_haut_pct: 92.0       # spec, 2/3, au-dessus de P-7
    debit_bas_pct: 90.0             # spec, 2/3 par boucle
    ecart_vapeur_eau_pct: 40.0      # HYPOTHESE (débit eau insuffisant)
    niveau_gv_bas_pct: 25.5         # spec (débit eau insuffisant)
    votes: {flux: "2/4", dt: "2/4", p_pzr: "2/4", niveau_pzr: "2/3", debit: "2/3", pompes: "2/4"}
  otdt:                             # ΔT surtempérature : K1 réglé pour un seuil à ~117 % du ΔT nominal (spec)
    k1: 1.17
    k2_par_c: 0.04                  # HYPOTHESE
    k3_par_bar: 0.013               # HYPOTHESE
    tau1_s: 30.0                    # HYPOTHESE (avance)
    tau2_s: 4.0                     # HYPOTHESE (retard)
    t_ref_c: 307.0                  # spec T'
    p_ref_bar: 155.0                # spec P'
    dt0_c: 36.2                     # ΔT nominal (calé sur le point nominal)
    prealarme_pct: 3.0              # spec : C-3 à 3 % du seuil
  opdt:                             # ΔT surpuissance ; HYPOTHESE (ordres de grandeur Westinghouse)
    k4: 1.09
    k5_par_c: 0.036
    tau3_s: 10.0
    k6_par_c: 0.0022
    t_ref_c: 307.0
    prealarme_pct: 3.0              # spec : C-4
  c9: {p_cond_max_bar: 0.17, p_cond_perte_bar: 0.26, crf_mini: 1}
